name: "Build and Test"

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

on:
  - push
  - pull_request

jobs:
  test:
    name: Build and Test

    runs-on: ubuntu-26.04
    # The main build uploads source maps to PostHog. Its key lives in the
    # `sourcemaps` environment, so only the deploy job uses `production`.
    # Other builds run without an environment.
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'sourcemaps' || '' }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install Java for documentation examples
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun ci

      - name: Run tests
        run: bun run test

      - name: Run typecheck
        run: bun run typecheck

      - name: Run check
        run: bun run check

      - name: Compile the documented Java plugin
        run: bun run docs:java

      - name: Run build
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.POSTHOG_PERSONAL_API_KEY || '' }}
        run: bun run build

      - name: Validate Cloudflare deployment package
        run: bun run deploy:check

      - name: Test production routes
        run: |
          node node_modules/vite/bin/vite.js preview --port 3000 > /tmp/site-preview.log 2>&1 &
          site_preview_pid=$!
          trap 'kill "$site_preview_pid"' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail --silent --show-error http://localhost:3000/ > /dev/null
          bun run test:site

      - name: Upload Cloudflare deployment package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-output
          path: .cloudflare/output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun ci

      - name: Download Cloudflare deployment package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare-output
          path: .cloudflare/output

      - name: Deploy production to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx cf deploy --prebuilt --mode production

      - name: Verify production deployment
        env:
          SITE_TEST_URL: https://skinsrestorer.net
        run: bun test scripts/site.test.ts scripts/studio-seo.test.ts
