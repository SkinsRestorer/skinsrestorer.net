lefthook: bunx --no-install lefthook
min_version: 2.2.2

pre-commit:
  piped: true
  jobs:
    - name: lint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bunx --no-install oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: format
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,scss,md,mdx,yml,yaml,toml}"
      run: bunx --no-install oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

# Typecheck, docs:java, and the build stay in CI. They need generated
# Cloudflare types, Maven, or a full Vite build and take minutes.
pre-push:
  commands:
    knip:
      run: bun run knip
    lint:
      run: bun run lint
    format:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,scss,md,mdx,yml,yaml,toml}"
      run: bun run format:check
    test:
      run: bun run test
    # Translations and docs checks read catalogs, guides, the release inventory,
    # and website sources across the tree. They take seconds, so run them on
    # every push instead of maintaining path globs.
    translations:
      run: bun run i18n:check
    docs:
      run: bun run docs:check
