lefthook: bunx --no-install lefthook
min_version: 2.2.2

pre-commit:
  piped: true
  jobs:
    - name: lint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bunx --no-install oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: format
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,scss,md,mdx,yml,yaml,toml}"
      run: bunx --no-install oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

pre-push:
  commands:
    format:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,md,mdx,yml,yaml}"
      run: bun run format:check
    translations:
      glob: "{locales/*,scripts/check-translations.ts}"
      run: bun run i18n:check
    docs:
      glob: "{content/*,scripts/check-docs.ts,source.config.ts}"
      run: bun run docs:check
